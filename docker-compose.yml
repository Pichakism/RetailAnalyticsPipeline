services:
  postgres:
    image: postgres:17
    container_name: retail-analytics-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      POSTGRES_DB: retail_analytics

    ports:
      - "5433:5432"

    volumes:
      - retail_analytics_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: retail-analytics-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5051:80"

    depends_on:
      - postgres

volumes:
  retail_analytics_data: